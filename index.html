<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joel van Hees — Multidisciplinary Designer & Web Developer based in Cologne. Brand systems, web development, 3D &amp; motion, generative design and kinetic sculpture." />
    <meta name="author" content="Joel van Hees" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <link rel="canonical" href="https://joelvanhees.de" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Joel van Hees | Multidisciplinary Designer &amp; Web Developer" />
    <meta property="og:description" content="Brand systems, web development, 3D &amp; motion, generative design and kinetic sculpture — one practice, from concept to shipped site or finished object." />
    <meta property="og:url" content="https://joelvanhees.de" />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joel van Hees | Multidisciplinary Designer &amp; Web Developer" />
    <meta name="twitter:description" content="Brand systems, web development, 3D &amp; motion, generative design and kinetic sculpture." />

    <!--
      Structured data. Search engines had nothing authoritative to go on here,
      so they described the practice from third-party pages and got it wrong —
      "graphic designer", with web development missing entirely. This states it
      first-hand, on the canonical domain, in the form crawlers actually read.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://joelvanhees.de/#person",
        "name": "Joel van Hees",
        "url": "https://joelvanhees.de",
        "jobTitle": ["Multidisciplinary Designer", "Web Developer"],
        "description": "Joel van Hees is a multidisciplinary designer and web developer based in Cologne. His practice spans brand systems, web development, generative and 3D work, industrial design and kinetic sculpture.",
        "knowsAbout": [
          "Multidisciplinary Design",
          "Web Development",
          "Frontend Engineering",
          "React",
          "Three.js",
          "WebGL",
          "GLSL Shaders",
          "Brand Systems",
          "Visual Identity",
          "Typography",
          "3D and Motion Design",
          "Generative Design",
          "Industrial Design",
          "Kinetic Sculpture",
          "Animatronics"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cologne",
          "addressCountry": "DE"
        },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Köln International School of Design (KISD)" },
          { "@type": "CollegeOrUniversity", "name": "Peter Behrens School of Arts (HSD)" }
        ],
        "sameAs": ["https://www.instagram.com/joelvanhees"]
      }
    </script>

    <!-- Type is system-resident (Arial / SF Mono per Identity System V03.1);
         only the Rubik display face still has to be fetched. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050505" />
    <link rel="preload" href="/fonts/Rubik80sFade-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />

    <title>Joel van Hees | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Last resort. The app bundle is a module: an older browser that cannot
      parse it fails silently, leaving #root empty over a near-black body — a
      blank page with nothing to read and no way to get in touch. This block
      is plain HTML with inline styles so it survives a missing stylesheet,
      and the script below is a classic script so it runs even where the
      module never does.
    -->
    <div id="boot-fallback" hidden style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:2rem;text-align:center;font-family:Arial,Helvetica,sans-serif;color:#e0e0e0;background:#050505">
      <div style="max-width:32rem">
        <p style="font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 0 .75rem">Joel van Hees</p>
        <p style="opacity:.7;line-height:1.6;margin:0 0 1.5rem">
          This page could not start in this browser. A reload or a current browser usually fixes it.
        </p>
        <p style="margin:0"><a href="mailto:kontakt@joelvanhees.de" style="color:#c7ff2e">kontakt@joelvanhees.de</a></p>
      </div>
    </div>

    <script>
      (function () {
        var shown = false;
        function reveal() {
          if (shown) return;
          var root = document.getElementById('root');
          if (root && root.children.length) return; // the app made it
          shown = true;
          var el = document.getElementById('boot-fallback');
          // Both, and in this order: `hidden` alone is a UA rule that an
          // inline display would beat, which is exactly how this block ended
          // up permanently visible at the foot of every page.
          if (el) { el.hidden = false; el.style.display = 'flex'; }
        }
        // A boot error is decisive, but give React a moment to recover first.
        window.addEventListener('error', function () { setTimeout(reveal, 1500); });
        // And a plain deadline, for the browser that simply never runs the module.
        setTimeout(reveal, 8000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
