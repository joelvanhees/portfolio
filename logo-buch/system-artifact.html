/* Layout: a swipeable spec book. Each page is one chapter of the system, scrolls vertically, and is built from the
   same tokens it documents. Deliberate single look (paper, ink, press blue), so every colour is set explicitly. */
:root{
  /* colour */
  --paper:#F1F0EC; --ink:#141414; --blue:#24398F; --stone:#6E6C66; --line:#D6D4CD; --pink:#FF4FA3; --card:#E9E7E1;
  /* type */
  --f-display:'JM Murmure',Impact,sans-serif; --f-lead:'JM Caslon Display',Georgia,serif;
  --f-text:'JM Caslon Text',Georgia,serif; --f-ui:'JM Compagnon','Courier New',monospace;
  /* spacing, 4 px base */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-text);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- type scale (the same classes the spec documents) ---------- */
.t-d1,.t-h1,.t-h2,.t-h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:0;margin:0;filter:url(#ink);text-wrap:balance}
.t-d1{font-size:clamp(72px,10vw,144px);line-height:.86}
.t-h1{font-size:clamp(52px,6.2vw,88px);line-height:.9}
.t-h2{font-size:clamp(38px,4vw,56px);line-height:.92}
.t-h3{font-size:clamp(28px,2.6vw,36px);line-height:.95}
.t-lead{font:400 clamp(21px,1.9vw,26px)/1.3 var(--f-lead);margin:0;max-width:34ch;text-wrap:pretty}
.t-bl{font:400 clamp(18px,1.4vw,19px)/1.6 var(--f-text);margin:0;max-width:62ch}
.t-body{font:400 clamp(16px,1.2vw,17px)/1.6 var(--f-text);margin:0;max-width:62ch}
.t-small{font:400 14px/1.5 var(--f-text);margin:0}
.t-label{font:400 clamp(11px,.9vw,12px)/1.3 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;margin:0}
.t-meta{font:400 clamp(10px,.8vw,10.5px)/1.4 var(--f-ui);letter-spacing:.08em;margin:0;color:var(--stone)}
.mute{color:var(--stone)}
.gr{filter:url(#ink)}
svg.lg{display:block;width:100%;height:100%;overflow:visible}
.i{fill:currentColor}

/* ---------- magazine shell ---------- */
.mag{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.mag::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;background:var(--paper) url(tex/paper.jpg) center/cover}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s7) 128px;display:flex;flex-direction:column;gap:var(--s7)}
.ph{display:flex;flex-direction:column}
.ph-meta{display:flex;gap:var(--s4);flex-wrap:wrap;justify-content:space-between;padding-bottom:var(--s3);border-bottom:1px solid var(--ink);margin-bottom:var(--s5)}
.ph .t-h1{margin-bottom:var(--s5)}
.sec{display:flex;flex-direction:column;gap:var(--s5)}
.sec-h{display:flex;align-items:baseline;gap:var(--s3);border-top:1px solid var(--line);padding-top:var(--s3)}
.grid{display:grid;gap:var(--s5)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g12{grid-template-columns:7fr 5fr}
.tile{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.box{position:relative;display:flex;align-items:center;justify-content:center;padding:10%;background:rgba(255,255,255,.35);min-height:200px;color:var(--ink);overflow:hidden}
.box.blue{background:var(--blue);color:var(--paper)}.box.ink{background:var(--ink);color:var(--paper)}
.box svg.lg{max-height:220px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);z-index:5;pointer-events:none;
  padding:var(--s2) max(16px,env(safe-area-inset-right,0px)) calc(var(--s3) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav>*{pointer-events:auto}
.nav button{all:unset;pointer-events:auto;cursor:pointer;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);border:1px solid var(--ink);font:400 18px/1 var(--f-ui)}
.nav button:hover{background:var(--ink);color:var(--paper)}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nav .mid{display:flex;gap:var(--s3);align-items:center;background:var(--paper);border:1px solid var(--ink);padding:0 var(--s4);height:48px}
.nav .mid b{font:400 28px/.8 var(--f-display);filter:url(#ink)}
.nav .mid span{font:400 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- label grammar (Etikett) ---------- */
.crop{position:relative}
.cm{position:absolute;width:14px;height:14px;border:0 solid currentColor;pointer-events:none}
.cm.tl{top:-10px;left:-10px;border-top-width:1.5px;border-left-width:1.5px}
.cm.tr{top:-10px;right:-10px;border-top-width:1.5px;border-right-width:1.5px}
.cm.bl{bottom:-10px;left:-10px;border-bottom-width:1.5px;border-left-width:1.5px}
.cm.br{bottom:-10px;right:-10px;border-bottom-width:1.5px;border-right-width:1.5px}
.ett{container-type:inline-size;background:var(--paper) url(tex/paper.jpg) center/cover;color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:12% 9%;position:relative;overflow:hidden;aspect-ratio:4/5}
.ett>*:not(.cm):not(.over){position:relative;z-index:1}

.e-k{font:400 3.6cqw/1.3 var(--f-ui);letter-spacing:.18em;text-transform:uppercase}

/* ---------- spec helpers ---------- */
.spec{width:100%;border-collapse:collapse;font:400 13px/1.45 var(--f-ui)}

.chip{display:inline-block;font:400 10.5px/1 var(--f-ui);letter-spacing:.06em;background:var(--pink);color:var(--ink);padding:3px 5px}

.rlw{position:relative;display:inline-flex}

/* ---------- components (the real ones) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;font:400 14px/1 var(--f-ui);letter-spacing:.04em;background:var(--blue);color:var(--paper);border:1px solid var(--blue);white-space:nowrap}

.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;font:400 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line)}

.hdr{display:flex;align-items:center;gap:32px;height:80px;padding:0 64px;background:var(--paper);border-bottom:1px solid var(--line);font:400 16px/1 var(--f-text);min-width:0}

/* redlines: hatch the padding of every [data-rl] element and label it */
function redlines(){document.querySelectorAll('.rl-pad,.rl-num').forEach(n=>n.remove());
 document.querySelectorAll('[data-rl]').forEach(el=>{const w=el.parentElement;const cs=getComputedStyle(el);
  const pt=parseFloat(cs.paddingTop),pr=parseFloat(cs.paddingRight),pb=parseFloat(cs.paddingBottom),pl=parseFloat(cs.paddingLeft);
  const W=el.offsetWidth,H=el.offsetHeight,x=el.offsetLeft,y=el.offsetTop;
  const add=(l,t,wd,ht,val,lx,ly)=>{if(val<1)return;const d=document.createElement('div');d.className='rl-pad';Object.assign(d.style,{left:l+'px',top:t+'px',width:wd+'px',height:ht+'px'});w.appendChild(d);
   const n=document.createElement('div');n.className='rl-num';n.textContent=Math.round(val);Object.assign(n.style,{left:lx+'px',top:ly+'px'});w.appendChild(n)};
  add(x,y,pl,H,pl,x+pl/2,y+H/2);add(x+W-pr,y,pr,H,pr,x+W-pr/2,y+H/2);add(x,y,W,pt,pt,x+W/2,y+pt/2);add(x,y+H-pb,W,pb,pb,x+W/2,y+H-pb/2);
  const lab=document.createElement('div');lab.className='rl-num';lab.textContent='H '+Math.round(H);Object.assign(lab.style,{left:(x+W-2)+'px',top:(y-2)+'px',transform:'translate(-100%,-100%)'});w.appendChild(lab)})}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{redlines();setTimeout(redlines,500)});
addEventListener('resize',()=>setTimeout(redlines,100));

/* ---------- navigation (state-based; the hash is read once on load only) ---------- */
const pages=[...mag.children],tot=pages.length,cur=document.getElementById('cur'),nm=document.getElementById('nm');
let at=0,settle=null;
function upd(){cur.textContent=pad(at+1);nm.textContent=pages[at]?.dataset.name||''}
const go=n=>{n=Math.max(0,Math.min(tot-1,n));at=n;upd();mag.scrollTo({left:n*mag.clientWidth})};
mag.addEventListener('scroll',()=>{clearTimeout(settle);settle=setTimeout(()=>{at=Math.round(mag.scrollLeft/mag.clientWidth);upd()},90)},{passive:true});
document.getElementById('prev').onclick=()=>go(at-1);
document.getElementById('next').onclick=()=>go(at+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(at+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(at-1)}});
addEventListener('resize',()=>{mag.style.scrollBehavior='auto';mag.scrollLeft=at*mag.clientWidth;mag.style.scrollBehavior=''});
(()=>{const m=location.hash.match(/^#seite-(\d+)$/);if(m){at=Math.max(0,Math.min(tot-1,+m[1]-1));mag.style.scrollBehavior='auto';mag.scrollLeft=at*mag.clientWidth;mag.style.scrollBehavior=''}upd()})();
