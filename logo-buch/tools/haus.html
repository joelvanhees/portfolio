{{FONTS}}
{{UIFONTS}}
/* Layout: horizontal magazine; one page per finalist = one complete identity system, styled in its own fonts and colors.
   Each system page is a deliberate single look, so every color is set explicitly per page. */
:root{--chrome-bg:#F0EFEB;--chrome-fg:#151515;--chrome-line:#d6d4cd;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chrome-bg:#141413;--chrome-fg:#ECEAE4;--chrome-line:#33322f;color-scheme:dark}}
:root[data-theme="dark"]{--chrome-bg:#141413;--chrome-fg:#ECEAE4;--chrome-line:#33322f;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome-bg);color:var(--chrome-fg);font-family:"Compagnon",ui-monospace,monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
.mag{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.mag::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- system page ---------- */
.sys{background:var(--bg);color:var(--fg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:26px 120px;display:flex;flex-direction:column;gap:22px}
.sh{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;font:400 12px/1.2 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sh .no{color:var(--fg)}
.sh .ix{margin-left:auto}
.lab{margin:18px 0 0;display:flex;gap:12px;align-items:baseline;font:400 12px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}
.lab b{font-weight:400;color:var(--fg)}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:stretch}
.hero-logo{background:var(--card);min-height:clamp(300px,46vh,500px);display:flex;align-items:center;justify-content:center;padding:8%;position:relative}
.hero-logo svg{width:100%;height:100%;max-height:360px;color:var(--fg)}
.hero-txt{display:flex;flex-direction:column;justify-content:flex-end;gap:16px;min-width:0}
.disp{margin:0;font-family:var(--fd);font-weight:400;font-size:calc(clamp(44px,6vw,92px)*var(--ds,1));line-height:var(--dl,.92);letter-spacing:var(--dt,-.01em);text-transform:var(--dtt,none);text-wrap:balance;overflow-wrap:break-word}
.lead{margin:0;font:400 calc(17px*var(--bs,1))/1.5 var(--fb);max-width:46ch}
.kw{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.kw li{font:400 11.5px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:7px 9px}

.logos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.lc{background:var(--card);display:grid;grid-template-rows:190px auto;min-width:0}
.lc .v{display:flex;align-items:center;justify-content:center;padding:18px 12%;min-height:0;height:190px}
.lc .v svg{width:100%;height:100%;max-height:110px}
.lc .t{padding:8px 10px;font:400 10.5px/1.3 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-top:1px solid var(--line)}
.lc.w2{grid-column:span 2}.lc.w3{grid-column:span 3}
.lc.neg{background:var(--fg)}.lc.neg svg{color:var(--bg)}.lc.neg .t{color:var(--bg);opacity:.7;border-color:rgba(127,127,127,.35)}
.lc.acc{background:var(--acc)}.lc.acc svg{color:var(--onacc)}.lc.acc .t{color:var(--onacc);opacity:.75;border-color:rgba(127,127,127,.35)}
.lc.acc .a,.lc.neg .a{fill:currentColor}
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:22px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:6px;font:400 10px/1 var(--fm);color:var(--mut)}
.clear{position:relative;padding:22px;outline:1px dashed var(--mut);outline-offset:-1px;display:flex;align-items:center;justify-content:center;height:100%;width:100%}
.clear svg{max-height:100%;width:100%;height:100%}
.clear i{position:absolute;font:400 9.5px/1 var(--fm);color:var(--mut);font-style:normal}
.clear i.x{top:4px;left:50%;transform:translateX(-50%)}
.clear i.y{left:4px;top:50%;transform:translateY(-50%)}

.type{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:150px 230px minmax(0,1fr);gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.tr:first-child{border-top:1px solid var(--line)}
.tr .role{font:400 11px/1.3 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.tr .meta{font:400 12px/1.45 var(--fm);color:var(--mut)}
.tr .meta b{display:block;font-weight:400;color:var(--fg);font-size:13px}
.tr .spec{min-width:0;overflow-wrap:anywhere}
.s-title{font-family:var(--fd);font-size:calc(clamp(40px,5vw,76px)*var(--ds,1));line-height:var(--dl,.95);letter-spacing:var(--dt,-.01em);text-transform:var(--dtt,none)}
.s-sub{font-family:var(--fs);font-size:calc(24px*var(--ss,1));line-height:1.2;letter-spacing:var(--st,0);text-transform:var(--stt,none);font-style:var(--sst,normal)}
.s-body{font-family:var(--fb);font-size:calc(17px*var(--bs,1));line-height:1.55;max-width:62ch}
.s-body em{font-style:italic}
.s-mono{font-family:var(--fm);font-size:13px;line-height:1.4;letter-spacing:.04em}
.glyphs{font-family:var(--fd);font-size:calc(30px*var(--ds,1));line-height:1.1;color:var(--mut);margin-top:8px;text-transform:var(--dtt,none);letter-spacing:var(--dt,0)}

.colors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sw{min-width:0}
.sw .chip{height:110px;border:1px solid var(--line)}
.sw b{display:block;margin-top:8px;font:400 13px/1.2 var(--fb)}
.sw span{display:block;font:400 11px/1.4 var(--fm);color:var(--mut);letter-spacing:.04em}
.ratio{display:flex;height:14px;margin-top:4px;border:1px solid var(--line)}
.ratio i{display:block;height:100%}

.apps{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.app{min-width:0;display:flex;flex-direction:column;gap:6px}
.app .t{font:400 10.5px/1.3 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.a-cards{grid-column:span 5}.a-web{grid-column:span 7}.a-poster{grid-column:span 4}.a-social{grid-column:span 4}.a-mat{grid-column:span 4}
.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;background:var(--card);padding:22px}
.card{aspect-ratio:85/55;min-width:0;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.12);overflow:hidden;container-type:inline-size}
.card.front{background:var(--cbg,var(--bg));color:var(--cfg,var(--fg));display:flex;align-items:center;justify-content:center}
.card.front svg{width:58%;height:58%;color:inherit}
.card.back{background:var(--bg);color:var(--fg);padding:7% 8%;display:flex;flex-direction:column;justify-content:space-between}
.card.back .n{font-family:var(--fs);font-size:9cqw;line-height:1.05;text-transform:var(--stt,none);letter-spacing:var(--st,0);font-style:var(--sst,normal)}
.card.back .r{font-family:var(--fm);font-size:4.4cqw;line-height:1.5;color:var(--mut)}
.web{background:var(--card);padding:0;border:1px solid var(--line);display:flex;flex-direction:column;min-height:100%}
.web .bar{display:flex;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line)}
.web .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.web .site{background:var(--bg);flex:1;padding:18px 22px 24px;display:flex;flex-direction:column;gap:18px}
.web nav{display:flex;align-items:center;gap:18px;font-family:var(--fb);font-size:13px}
.web nav svg{height:26px;width:auto;max-width:90px;color:var(--fg);margin-right:auto}
.web h5{margin:0;font-family:var(--fd);font-weight:400;font-size:calc(clamp(30px,3.4vw,54px)*var(--ds,1));line-height:var(--dl,.95);letter-spacing:var(--dt,0);text-transform:var(--dtt,none);max-width:14ch}
.web p{margin:0;font-family:var(--fb);font-size:14px;line-height:1.5;max-width:44ch;color:var(--mut)}
.web .btn{align-self:flex-start;font-family:var(--fs);font-size:14px;padding:10px 16px;background:var(--acc);color:var(--onacc);border-radius:var(--rad,0);text-transform:var(--stt,none);letter-spacing:var(--st,0);font-style:var(--sst,normal)}
.poster{aspect-ratio:1/1.414;background:var(--pbg,var(--acc));color:var(--pfg,var(--onacc));padding:9%;display:flex;flex-direction:column;justify-content:space-between;container-type:inline-size;position:relative;overflow:hidden}
.poster .pt{font-family:var(--fd);font-size:calc(19cqw*var(--ds,1));line-height:var(--dl,.9);letter-spacing:var(--dt,0);text-transform:var(--dtt,none);word-break:break-word}
.poster .pd{font-family:var(--fs);font-size:5.6cqw;line-height:1.2;text-transform:var(--stt,none);letter-spacing:var(--st,0);font-style:var(--sst,normal)}
.poster .pm{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-family:var(--fm);font-size:3.4cqw;line-height:1.4}
.poster svg{height:15cqw;width:auto;max-width:45%;color:inherit}
.social{aspect-ratio:4/5;background:var(--card);padding:8%;display:flex;flex-direction:column;justify-content:space-between;container-type:inline-size;border:1px solid var(--line)}
.social .q{font-family:var(--fs);font-size:8.6cqw;line-height:1.15;text-transform:var(--stt,none);letter-spacing:var(--st,0);font-style:var(--sst,normal)}
.social .qm{font-family:var(--fm);font-size:3.6cqw;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.social svg{height:9cqw;width:auto;max-width:40%;color:var(--fg)}
.mat{aspect-ratio:4/5;position:relative;overflow:hidden;background:#222}
.lc .mat{aspect-ratio:auto;height:190px}
.lc .v .mat svg{max-height:none}
.mat svg.matsvg{position:absolute;inset:0;width:100%;height:100%}
.i{fill:currentColor}.a{fill:var(--acc)}.r{fill:currentColor}.g{fill:currentColor}

/* ---------- cover / overview / end (chrome-styled) ---------- */
.cover{background:#e9e8e3 url(tex/paper.jpg) center/cover;color:#141414;display:flex;flex-direction:column;justify-content:space-between;padding-block:24px 110px}
.cover .top{display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;flex-wrap:wrap}
.cover h1{margin:0;font:400 clamp(96px,19vw,280px)/.8 "Le Murmure",Impact,sans-serif;mix-blend-mode:multiply;filter:url(#f-ink-cover)}
.cover p{margin:0;font:400 clamp(19px,2.2vw,28px)/1.25 "Libre Caslon Display",Georgia,serif;max-width:32ch}
.over{padding-block:24px 110px;display:flex;flex-direction:column;gap:16px}
.over h2{margin:0;font:400 clamp(60px,8vw,110px)/.8 "Le Murmure",Impact,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tiles a{display:grid;grid-template-rows:minmax(0,1fr) auto;aspect-ratio:1/1;text-decoration:none;min-width:0}
.tiles .tv{display:flex;align-items:center;justify-content:center;padding:14% 18%;min-height:0}
.tiles .tv svg{width:100%;height:100%;max-height:100%}
.tiles .tm{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tiles .chips{display:flex}.tiles .chips i{width:12px;height:12px;display:block;border:1px solid rgba(127,127,127,.4);margin-left:-3px}
.end{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px 110px}
.end h2{margin:0;font:400 clamp(70px,11vw,160px)/.8 "Le Murmure",Impact,sans-serif}
.end p{margin:0;font:400 20px/1.45 "Libre Caslon Display",Georgia,serif;max-width:46ch}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5;pointer-events:none;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav>*{pointer-events:auto}
.nav button{all:unset;pointer-events:auto;cursor:pointer;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:var(--chrome-bg);color:var(--chrome-fg);border:1px solid var(--chrome-line);font:400 18px/1 "Compagnon",monospace}
.nav button:focus-visible{outline:2px solid var(--chrome-fg);outline-offset:2px}
.nav .mid{display:flex;gap:12px;align-items:center;background:var(--chrome-bg);color:var(--chrome-fg);border:1px solid var(--chrome-line);padding:0 14px;height:46px;font-size:12px;letter-spacing:.08em}
.nav .mid b{font:400 26px/.8 "Le Murmure",Impact,sans-serif;letter-spacing:0}
.nav .mid span.nm{opacity:.7;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .r{display:flex;gap:6px}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .logos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lc.w2,.lc.w3{grid-column:span 2}
  .tr{grid-template-columns:1fr;gap:6px}
  .colors{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a-cards,.a-web{grid-column:span 12}.a-poster,.a-social,.a-mat{grid-column:span 6}
}
@media (max-width:560px){.a-poster,.a-social,.a-mat{grid-column:span 12}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mag{scroll-behavior:auto}}
{{TOPCSS}}
{{HAUSCSS}}
</style>

function svgOf(m,cls=''){ if(!m) return ''; const rough=m.parts.some(p=>p[1]==='r'); return `<svg viewBox="${vb(m)}" class="${cls}" role="img" aria-label="Logo"><g ${rough?'filter="url(#f-rough)"':''}>${m.parts.map(([d,c])=>`<path class="${c}" d="${d}"/>`).join('')}</g></svg>`}
function lockups(s){const f=FIN[s.key];const pr=svgOf(f.primary);
  const sec=f.secondary?svgOf(f.secondary):(f.word?`<div style="display:flex;align-items:center;gap:8%;width:100%;height:100%">${svgOf(f.primary)}${svgOf(f.word)}</div>`:'');
  const sig=f.signet?svgOf(f.signet):svgOf(f.primary);return {pr,sec,sig};}

 <div class="sh"><span class="no">Nº ${pad(s.n)} · ${s.name}</span><span>${s.fit}</span><span class="ix">System ${i+1} / 5</span></div>

  <div class="lc w2"><div class="v"><div class="sizes">${[16,24,40].map(px=>`<div><span style="display:block;width:${px*1.6}px;height:${px}px">${sig}</span>${px} px</div>`).join('')}</div></div><div class="t">Mindestgrößen · Signet ab 16 px</div></div>

 </div>
${more(s)}
</div></section>`}

/* ---------- pages ---------- */
const mag=document.getElementById('mag');let html='';
html+=buildHaus();
mag.innerHTML=html;

/* ---------- navigation ---------- */
const pages=[...mag.children],tot=pages.length,cur=document.getElementById('cur'),nm=document.getElementById('nm');
function upd(){const i=at;cur.textContent=pad(i+1);nm.textContent=pages[i]?.dataset.name||''}
let at=0,settle=null;
const idx=()=>at;
const go=n=>{n=Math.max(0,Math.min(tot-1,n));at=n;upd();mag.scrollTo({left:n*mag.clientWidth})};
mag.addEventListener('scroll',()=>{clearTimeout(settle);settle=setTimeout(()=>{at=Math.round(mag.scrollLeft/mag.clientWidth);upd()},90)},{passive:true});
document.getElementById('prev').onclick=()=>go(at-1);
document.getElementById('next').onclick=()=>go(at+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(at+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(at-1)}});
mag.querySelectorAll('[data-p]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(+a.dataset.p-1)}));
addEventListener('resize',()=>{mag.style.scrollBehavior='auto';mag.scrollLeft=at*mag.clientWidth;mag.style.scrollBehavior=''});
/* the hash is only read once on load: writing it while paging let the host echo stale hashes back and snap pages forward */
(()=>{const m=location.hash.match(/^#seite-(\d+)$/);if(m){at=Math.max(0,Math.min(tot-1,+m[1]-1));mag.style.scrollBehavior='auto';mag.scrollLeft=at*mag.clientWidth;mag.style.scrollBehavior=''}upd()})();
const root=document.documentElement;
document.getElementById('theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dark?'light':'dark'};
</script>
